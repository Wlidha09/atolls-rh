[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "netlify/functions"

# Put runtime secrets in Netlify's environment settings with Functions scope.
# Netlify's Next.js adapter deploys the route handlers.
# Do not add a catch-all SPA redirect or publish the source as a static site.
